x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/sqllab
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-32+chars}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  OTLP_ENDPOINT: http://otel-collector:4317
  TEMPORAL_HOST: temporal:7233
  CORS_ORIGINS: '["http://localhost:3000"]'

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: sqllab }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d sqllab"], interval: 5s, retries: 10 }

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on: { postgres: { condition: service_healthy } }
    environment: { DB: postgres12, DB_PORT: "5432", POSTGRES_USER: postgres, POSTGRES_PWD: postgres, POSTGRES_SEEDS: postgres }
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment: { TEMPORAL_ADDRESS: "temporal:7233", TEMPORAL_CORS_ORIGINS: "http://localhost:3000" }
    ports: ["8080:8080"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [jaeger]
    ports: ["4317:4317", "4318:4318", "8889:8889"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [otel-collector]
    ports: ["9090:9090"]

  api:
    build: ./backend
    environment: *backend-env
    depends_on: { postgres: { condition: service_healthy }, otel-collector: { condition: service_started } }
    ports: ["8000:8000"]
    restart: on-failure

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on: { postgres: { condition: service_healthy }, temporal: { condition: service_started }, otel-collector: { condition: service_started } }
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
